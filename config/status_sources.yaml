# External provider status pages + ev.energy's own InStatus page.
#
# Statuspage JSON endpoints are public and unauthenticated:
#   {base_url}/api/v2/status.json     — current overall status
#   {base_url}/api/v2/incidents.json  — recent incidents
#
# Smartcar + Enode URLs verified live 2026-05-13 (both return 200).

external_status_pages:
  - name: smartcar
    type: statuspage
    base_url: https://status.smartcar.com
    components_we_care_about: ["API", "Webhooks"]
  - name: enode
    type: statuspage
    base_url: https://status.enode.com
    components_we_care_about: ["API", "Webhooks"]

instatus:
  # InStatus REST API base. Bearer-token auth in Authorization header.
  base_url: https://api.instatus.com
  # Page ID (cuid) — set via INSTATUS_PAGE_ID env var at runtime.
  page_id_env: INSTATUS_PAGE_ID
