[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-agent"
version = "0.1.0"
description = "Semi-autonomous integration incident analyst for ev.energy."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ev.energy" }]
dependencies = [
    "anthropic>=0.40.0",
    "slack-sdk>=3.27.0",
    "notion-client>=2.2.1",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
incident-agent = "incident_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]
